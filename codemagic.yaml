workflows:
  ios-workflow:
    name: TandaFacil iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic2
    environment:
      vars:
        XCODE_PROJECT: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        BUNDLE_ID: com.tandafacil.app2026
      xcode: 16.2
      cocoapods: 1.16.2
      node: 20
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Fix config and prepare www
        script: |
          python3 -c "import json; p='capacitor.config.json'; d=json.load(open(p)); d['appId']='com.tandafacil.app2026'; d['webDir']='www'; json.dump(d, open(p,'w'), indent=2)"
          mkdir -p www
          cp index.html www/index.html
      - name: Add iOS platform
        script: |
          rm -rf ios
          npx cap add ios
          npx cap copy ios
      - name: Install Pods
        script: |
          cd ios/App
          pod install
      - name: Setup signing
        script: |
          keychain initialize
          openssl genrsa -out /tmp/private.key 2048
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --certificate-key @file:/tmp/private.key --verbose || true
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create --certificate-key @file:/tmp/private.key --verbose || true
          keychain add-certificates || true
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update
          cd ../..
      - name: Build IPA
        script: |
          keychain add-certificates || true
          security find-identity -v -p codesigning || true
          PROFILE_FILE=$(find ~/Library -name "*.mobileprovision" | head -1)
          echo "Perfil: $PROFILE_FILE"
          security cms -D -i "$PROFILE_FILE" > /tmp/profile.plist
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist)
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/profile.plist)
          echo "Usando perfil: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"
          echo "Team real: $TEAM_ID"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/*
          cp "$PROFILE_FILE" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision || true
          ls -lh ~/Library/MobileDevice/Provisioning\ Profiles/ || true
          cat > /tmp/make_plist.py << 'PY'
          import plistlib
          import os
          name = os.environ.get('PROFILE_NAME', '')
          data = {
            'method': 'app-store-connect',
            'signingStyle': 'manual',
            'provisioningProfiles': {'com.tandafacil.app2026': name}
          }
          f = open('/tmp/ExportOptions.plist', 'wb')
          plistlib.dump(data, f)
          f.close()
          PY
          PROFILE_NAME="$PROFILE_NAME" python3 /tmp/make_plist.py
          plutil -lint /tmp/ExportOptions.plist
          cat /tmp/ExportOptions.plist
          xcodebuild -workspace $XCODE_PROJECT -scheme $XCODE_SCHEME -configuration Release -destination generic/platform=iOS -archivePath $HOME/build/App.xcarchive archive DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution"
          xcodebuild -exportArchive -archivePath $HOME/build/App.xcarchive -exportPath $HOME/build/ipa -exportOptionsPlist /tmp/ExportOptions.plist
          mkdir -p build/ios/ipa
          cp $HOME/build/ipa/*.ipa build/ios/ipa/ || true
          ls -lh build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
