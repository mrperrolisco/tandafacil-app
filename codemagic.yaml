workflows:
  ios-workflow:
    name: TandaFacil iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.tandafacil.app2026
      xcode: 16.2
      cocoapods: 1.16.2
      node: 20
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Fix config and prepare www
        script: |
          python3 -c "import json; p='capacitor.config.json'; d=json.load(open(p)); d['appId']='com.tandafacil.app2026'; d['webDir']='www'; json.dump(d, open(p,'w'), indent=2)"
          mkdir -p www
          cp index.html www/index.html
      - name: Add iOS platform
        script: |
          rm -rf ios
          npx cap add ios
          npx cap copy ios
      - name: Install Pods
        script: |
          cd ios/App
          pod install
      - name: Enable Automatic Signing
        script: |
          python3 << 'PY'
          import re
          p = "ios/App/App.xcodeproj/project.pbxproj"
          c = open(p).read()
          c = c.replace("CODE_SIGN_STYLE = Manual;", "CODE_SIGN_STYLE = Automatic;")
          c = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = .*?;', '', c)
          c = re.sub(r'PROVISIONING_PROFILE = .*?;', '', c)
          c = re.sub(r'DEVELOPMENT_TEAM = .*?;', '', c)
          open(p,'w').write(c)
          print("Automatic signing ON")
          PY
      - name: Build IPA Automatic
        script: |
          keychain initialize
          # Buscar la llave .p8 de Codemagic
          KEY_PATH=$(find $HOME -name "AuthKey_*.p8" | head -1)
          echo "Key: $KEY_PATH"
          echo "KeyID: $APP_STORE_CONNECT_API_KEY_KEY_IDENTIFIER Issuer: $APP_STORE_CONNECT_API_KEY_ISSUER_ID"
          # Archive con provisionamiento automático usando tu API Key Admin BW85VHCQXV
          xcodebuild -project $XCODE_PROJECT -scheme $XCODE_SCHEME -configuration Release -archivePath $HOME/build/App.xcarchive archive -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_KEY_IDENTIFIER" -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_KEY_ISSUER_ID" CODE_SIGN_STYLE=Automatic
          # ExportOptions para App Store
          cat > /tmp/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>provisioningProfiles</key><dict/>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadBitcode</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath $HOME/build/App.xcarchive -exportPath $HOME/build/ipa -exportOptionsPlist /tmp/ExportOptions.plist -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_KEY_IDENTIFIER" -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_KEY_ISSUER_ID"
          ls -lh $HOME/build/ipa/
          mkdir -p build/ios/ipa
          cp $HOME/build/ipa/*.ipa build/ios/ipa/ || true
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/build/ipa/*.ipa
