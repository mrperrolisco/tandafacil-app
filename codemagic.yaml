workflows:
  ios-workflow:
    name: TandaFacil iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.tandafacil.app2026
      xcode: 16.2
      cocoapods: 1.16.2
      node: 20
    scripts:
      - name: Install dependencies
        script: |
          rm -rf node_modules package-lock.json
          npm install
          ls node_modules/.bin/ | grep cap
      - name: Fix webDir and prepare www
        script: |
          python3 -c "import json; p='capacitor.config.json'; d=json.load(open(p)); d['webDir']='www'; json.dump(d, open(p,'w'), indent=2)"
          mkdir -p www
          cp index.html www/index.html
      - name: Add and Sync iOS platform
        script: |
          rm -rf ios
          ./node_modules/.bin/cap add ios
          ./node_modules/.bin/cap copy ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --project $XCODE_PROJECT --scheme $XCODE_SCHEME
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
