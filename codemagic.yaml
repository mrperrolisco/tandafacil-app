workflows:
  ios-workflow:
    name: TandaFacil iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.tandafacil.app2026
      xcode: 16.2
      cocoapods: 1.16.2
      node: 20
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Fix config and prepare www
        script: |
          python3 -c "import json; p='capacitor.config.json'; d=json.load(open(p)); d['appId']='com.tandafacil.app2026'; d['webDir']='www'; json.dump(d, open(p,'w'), indent=2)"
          mkdir -p www
          cp index.html www/index.html
      - name: Add iOS platform
        script: |
          rm -rf ios
          npx cap add ios
          npx cap copy ios
      - name: Install Pods
        script: |
          cd ios/App
          pod install
      - name: DELETE OLD certs and CREATE NEW
        script: |
          keychain initialize
          echo "Listing old distribution certs..."
          app-store-connect certificates list --type IOS_DISTRIBUTION --verbose || true
          echo "Deleting old certs without private key..."
          app-store-connect certificates list --type IOS_DISTRIBUTION --format json 2>/dev/null | python3 -c "
          import json,sys
          try:
              data=json.load(sys.stdin)
              for c in data:
                  print(c['id'])
          except: pass
          " | while read certid; do
            if [ ! -z "$certid" ]; then
              echo "Deleting cert $certid"
              app-store-connect certificates delete $certid --verbose || true
            fi
          done
          echo "Now fetching new signing files with CREATE..."
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create --verbose
          keychain add-certificates
          ls -lh ~/Library/MobileDevice/Provisioning\ Profiles/
          xcode-project use-profiles --project $XCODE_PROJECT --verbose
      - name: Build IPA
        script: |
          xcode-project build-ipa --project $XCODE_PROJECT --scheme $XCODE_SCHEME --verbose
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
