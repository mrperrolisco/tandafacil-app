workflows:
ios-workflow:
name: TandaFacil iOS Build
instance_type: mac_mini_m2
max_build_duration: 60
integrations:
app_store_connect: Codemagic
environment:
vars:
XCODE_PROJECT: "ios/App/App.xcodeproj"
XCODE_SCHEME: "App"
BUNDLE_ID: "com.tandafacil.app2026"
node: 20.9.0
triggering:
events:
- push
branch_patterns:
- pattern: main
include: true
scripts:
- name: Install dependencies
script: |
npm install
npx cap sync ios
cd ios/App
pod install --repo-update || pod install
- name: Set up automatic code signing
script: |
app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create
app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_DEVELOPMENT --create
keychain initialize
keychain add-certificates
xcode-project use-profiles
- name: Build IPA for App Store
script: |
xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
artifacts:
- build/ios/ipa/*.ipa
- /tmp/xcodebuild_logs/*.log
publishing:
app_store_connect:
api_key: Codemagic
submit_to_testflight: false
