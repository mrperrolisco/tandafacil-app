# TandaFacil iOS - Codemagic workflow
name: TandaFacil-iOS
workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APP_ID: 6829997212
        BUNDLE_ID: "com.tandafacil.app"
    integrations:
      app_store_connect: Codemagic3
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Setup & Build Dependencies
        script: |
          echo "📦 Setting up build environment..."
          set -e
          node -v
          npm -v
          echo "Installing dependencies..."
          npm install
          echo "✅ Dependencies installed"
      - name: Build Web App
        script: |
          echo "🏗️ Building web app..."
          set -e
          echo "Preparing web assets..."
          mkdir -p www
          if [ -f "index-v8.html" ]; then
            cp index-v8.html www/index.html
            cp index-v8.html index.html
          else
            cp index.html www/index.html
          fi
          ls -lh www/
          echo "✅ Web assets ready"
      - name: Sync Capacitor iOS
        script: |
          echo "📱 Syncing iOS project..."
          set -e
          npm install -g @capacitor/cli@latest || npm install @capacitor/cli@latest
          npx cap add ios || echo "iOS already exists"
          npx cap sync ios
          echo "✅ iOS synced"
      - name: Generate App Icon from custom icon
        script: |
          echo "🎨 Generating App Icon from TandaFacil_Icono_1024.png..."
          set -e
          mkdir -p resources
          cp TandaFacil_Icono_1024.png resources/icon.png
          cp TandaFacil_Icono_1024.png resources/splash.png
          npm install -D @capacitor/assets || true
          npx @capacitor/assets generate --ios
          echo "✅ App Icon generated"
          ls -lh ios/App/App/Assets.xcassets/AppIcon.appiconset/ || true
      - name: Fetch signing files
        script: |
          echo "🔑 Fetching signing files..."
          set -e
          app-store-connect fetch-signing-files com.tandafacil.app --platform IOS --type IOS_APP_STORE --create || true
          app-store-connect list-certificates --type IOS_DISTRIBUTION || true
          echo "✅ Signing files fetched"
      - name: Set up code signing
        script: |
          echo "🔐 Setting up code signing..."
          set -e
          keychain initialize || true
          keychain add-certificates || true
          xcode-project use-profiles || true
          echo "✅ Code signing ready"
      - name: Build iOS IPA
        script: |
          echo "🏗️ Building IPA..."
          set -e
          cd ios/App
          pod install || true
          cd ../..
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -archivePath build/App.xcarchive archive -allowProvisioningUpdates DEVELOPMENT_TEAM=1990298540 CODE_SIGN_STYLE=Automatic
          mkdir -p build/export
          cat > build/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-// Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>provisioningProfiles</key>
            <dict/>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>1990298540</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/export -exportOptionsPlist build/ExportOptions.plist -allowProvisioningUpdates
          ls -lh build/export/
          echo "✅ IPA built"
    artifacts:
      - build/export/*.ipa
      - build/App.xcarchive
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: true
