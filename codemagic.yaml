workflows:
  tandafacil-ios:
    name: TandaFacil iOS
    instance_type: mac_mini_m1
    max_build_duration: 30
    integrations:
      app_store_connect: Codemagic2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    environment:
      vars:
        BUNDLE_ID: com.tandafacil.app
        XCODE_SCHEME: App
        XCODE_WORKSPACE: ios/App/App.xcworkspace
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Fix config and prepare www
        script: |
          mkdir -p www
          cp index-v8.html www/index.html
          npm install
          printf '{"appId":"com.tandafacil.app","appName":"TandaFacil","webDir":"www"}' > capacitor.config.json
          npx cap add ios
          npx cap sync ios
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = 6VQD37FLSQ;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "【entity-Apple¦canonical_name=Apple】 Development";/CODE_SIGN_IDENTITY = "【entity-Apple¦canonical_name=Apple】 Distribution";/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = "";/PROVISIONING_PROFILE_SPECIFIER = "TandaFacil Profile";/g' ios/App/App.xcodeproj/project.pbxproj
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE
          keychain add-certificates --certificate "TandaFacil Distribution"
          xcode-project use-profiles --profile "TandaFacil Profile"
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
