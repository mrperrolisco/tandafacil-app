workflows:
  ios-workflow:
    name: TandaFacil iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic2
    environment:
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.tandafacil.app2026
      xcode: 16.2
      cocoapods: 1.16.2
      node: 20
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Fix config and prepare www
        script: |
          python3 -c "import json; p='capacitor.config.json'; d=json.load(open(p)); d['appId']='com.tandafacil.app2026'; d['webDir']='www'; json.dump(d, open(p,'w'), indent=2)"
          mkdir -p www
          cp index.html www/index.html
      - name: Add iOS platform
        script: |
          rm -rf ios
          npx cap add ios
          npx cap copy ios
      - name: Install Pods
        script: |
          cd ios/App
          pod install
      - name: Setup signing with Codemagic2 Key
        script: |
          keychain initialize
          echo "Issuer=$APP_STORE_CONNECT_ISSUER_ID KeyID=$APP_STORE_CONNECT_KEY_IDENTIFIER"
          # Guardar la llave privada de Codemagic2 en archivo .p8
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > /tmp/AuthKey.p8
          # Si viene en base64, decodificar
          if grep -q "BEGIN" /tmp/AuthKey.p8; then echo "Llave en texto OK"; else echo "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 --decode > /tmp/AuthKey.p8; echo "Decodificada base64"; fi
          ls -lh /tmp/AuthKey.p8
          head -1 /tmp/AuthKey.p8
          # Descargar el certificado .p12 que generamos en UI usando su password
          # Usar fetch con la llave privada correcta para crear perfil
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create --certificate-key @file:/tmp/AuthKey.p8 --verbose || app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create --verbose || true
          keychain add-certificates || true
          ls -lh ~/Library/MobileDevice/Provisioning\ Profiles/ || true
          security find-identity -v -p codesigning || true
      - name: Build IPA Automatic
        script: |
          python3 << 'PY'
          import re
          p = "ios/App/App.xcodeproj/project.pbxproj"
          c = open(p).read()
          c = c.replace("CODE_SIGN_STYLE = Manual;", "CODE_SIGN_STYLE = Automatic;")
          c = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = .*?;', '', c)
          c = re.sub(r'PROVISIONING_PROFILE = .*?;', '', c)
          open(p,'w').write(c)
          print("Automatic ON")
          PY
          xcodebuild -project $XCODE_PROJECT -scheme $XCODE_SCHEME -configuration Release -archivePath $HOME/build/App.xcarchive archive -allowProvisioningUpdates -authenticationKeyPath /tmp/AuthKey.p8 -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" CODE_SIGN_STYLE=Automatic
          cat > /tmp/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>provisioningProfiles</key><dict/>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadBitcode</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath $HOME/build/App.xcarchive -exportPath $HOME/build/ipa -exportOptionsPlist /tmp/ExportOptions.plist -allowProvisioningUpdates -authenticationKeyPath /tmp/AuthKey.p8 -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          ls -lh $HOME/build/ipa/
          mkdir -p build/ios/ipa
          cp $HOME/build/ipa/*.ipa build/ios/ipa/ || true
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/build/ipa/*.ipa
