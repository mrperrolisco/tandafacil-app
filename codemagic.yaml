workflows:
  tandafacil-ios:
    name: TandaFacil iOS
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        XCODE_PROJECT: ios/App/App
        XCODE_SCHEME: App
        BUNDLE_ID: com.tandafacil.app
      xcode: latest
      cocoapods: default
      node: 20
    integrations:
      app_store_connect: Codemagic2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Fix config and prepare www
        script: |
          mkdir -p www
          cp index-v8.html www/index.html
          npm install
          npx cap sync ios
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace "$XCODE_PROJECT.xcworkspace" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
