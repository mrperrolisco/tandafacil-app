# TandaFacil iOS - Codemagic workflow
name: TandaFacil-iOS
workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APP_ID: 6829997212
        BUNDLE_ID: "com.tandafacil.app"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Setup & Build Dependencies
        script: |
          echo "📦 Setting up build environment..."
          set -e
          node -v
          npm -v
          echo "Installing dependencies..."
          npm install
          echo "✅ Dependencies installed"
      - name: Build Web App
        script: |
          echo "🏗️ Building web app..."
          set -e
          echo "Preparing web assets..."
          if [ -f "index-v8.html" ]; then
            cp index-v8.html index.html
          fi
          echo "✅ Web assets ready"
      - name: Sync Capacitor iOS
        script: |
          echo "📱 Syncing iOS project..."
          set -e
          npm install -g @capacitor/cli@latest || npm install @capacitor/cli@latest
          npx cap add ios || echo "iOS already exists"
          npx cap sync ios
          echo "✅ iOS synced"
      - name: Generate App Icon from custom icon
        script: |
          echo "🎨 Generating App Icon from TandaFacil_Icono_1024.png..."
          set -e
          mkdir -p resources
          cp TandaFacil_Icono_1024.png resources/icon.png
          cp TandaFacil_Icono_1024.png resources/splash.png
          npm install -D @capacitor/assets || true
          npx @capacitor/assets generate --ios
          echo "✅ App Icon generated"
          ls -lh ios/App/App/Assets.xcassets/AppIcon.appiconset/ || true
    artifacts:
      - ios/App/App.xcarchive
      - ios/App/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        submit_to_app_store: true
