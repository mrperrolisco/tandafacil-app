workflows:
  tandafacil-ios:
    name: TandaFacil iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic2
    environment:
      groups:
        - tandafacil
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.tandafacil.app"
        APPLE_TEAM_ID: "6VQD37FLSQ"
        APP_NAME: "TandaFacil"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up Node
        script: |
          node --version
          npm --version
      - name: Install dependencies
        script: |
          npm install
      - name: Build web
        script: |
          mkdir -p www
          cp index-v8.html www/index.html
          ls -lh www/index.html
      - name: Sync Capacitor iOS
        script: |
          rm -f capacitor.config.ts capacitor.config.js capacitor.config.cjs
          if [ ! -f capacitor.config.json ]; then
            printf '{\n  "appId": "com.tandafacil.app",\n  "appName": "TandaFacil",\n  "webDir": "www"\n}\n' > capacitor.config.json
          fi
          cat capacitor.config.json
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios
      - name: Force automatic signing
        script: |
          python3 << 'PY'
          import pathlib, re
          p = pathlib.Path("ios/App/App.xcodeproj/project.pbxproj")
          t = p.read_text()
          # Poner Automatic en todos lados
          t = t.replace("CODE_SIGN_STYLE = Manual;", "CODE_SIGN_STYLE = Automatic;")
          # Si no hay CODE_SIGN_STYLE, no pasa nada, lo pasamos por xcodebuild
          # Poner el equipo: si está vacío, ponerlo. Si ya tiene uno, reemplazarlo.
          t = re.sub(r'DEVELOPMENT_TEAM = "[^"]*";', 'DEVELOPMENT_TEAM = 6VQD37FLSQ;', t)
          # Si no había ninguna línea DEVELOPMENT_TEAM, agregar una después de CODE_SIGN_STYLE
          if "DEVELOPMENT_TEAM = 6VQD37FLSQ;" not in t:
              t = t.replace("CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Automatic;\n\t\t\t\tDEVELOPMENT_TEAM = 6VQD37FLSQ;")
          p.write_text(t)
          print("--- CHECK ---")
          for line in t.splitlines():
              if "CODE_SIGN_STYLE" in line or "DEVELOPMENT_TEAM" in line:
                  print(line.strip())
          PY
      - name: Set build version
        script: |
          cd ios/App
          agvtool new-version -all $PROJECT_BUILD_NUMBER
          cd ../..
      - name: Build IPA
        script: |
          mkdir -p build/ios/ipa
          python3 -c "import plistlib; plistlib.dump({'method':'app-store-connect','teamID':'6VQD37FLSQ','signingStyle':'automatic','uploadBitcode':False,'uploadSymbols':True,'compileBitcode':False}, open('ExportOptions.plist','wb'))"
          cat ExportOptions.plist
          xcodebuild -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME" -configuration Release -destination "generic/platform=iOS" -archivePath build/ios/App.xcarchive -allowProvisioningUpdates DEVELOPMENT_TEAM=6VQD37FLSQ CODE_SIGN_STYLE=Automatic PRODUCT_BUNDLE_IDENTIFIER=com.tandafacil.app archive
          xcodebuild -exportArchive -archivePath build/ios/App.xcarchive -exportPath build/ios/ipa -exportOptionsPlist ExportOptions.plist -allowProvisioningUpdates
          ls -lh build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
