workflows:
  tandafacil-ios:
    name: TandaFacil iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic2
    environment:
      groups:
        - tandafacil
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.tandafacil.app"
        APPLE_TEAM_ID: "6VQD37FLSQ"
        APP_NAME: "TandaFacil"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up Node
        script: |
          node --version
          npm --version
      - name: Install dependencies
        script: |
          npm install
      - name: Build web
        script: |
          mkdir -p www
          cp index-v8.html www/index.html
          ls -lh www/index.html
      - name: Sync Capacitor iOS
        script: |
          rm -f capacitor.config.ts capacitor.config.js capacitor.config.cjs
          if [ ! -f capacitor.config.json ]; then
            printf '{\n  "appId": "com.tandafacil.app",\n  "appName": "TandaFacil",\n  "webDir": "www"\n}\n' > capacitor.config.json
          fi
          cat capacitor.config.json
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios
      - name: Force manual signing
        script: |
          python3 << 'PY'
          import pathlib, re
          p = pathlib.Path("ios/App/App.xcodeproj/project.pbxproj")
          t = p.read_text()
          t = t.replace("CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;")
          t = re.sub(r'DEVELOPMENT_TEAM = "[^"]*";', 'DEVELOPMENT_TEAM = 6VQD37FLSQ;', t)
          if "DEVELOPMENT_TEAM = 6VQD37FLSQ;" not in t:
              t = t.replace("CODE_SIGN_STYLE = Manual;", "CODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = 6VQD37FLSQ;")
          p.write_text(t)
          print("--- CHECK ---")
          for line in t.splitlines():
              if "CODE_SIGN_STYLE" in line or "DEVELOPMENT_TEAM" in line:
                  print(line.strip())
          PY
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build version
        script: |
          cd ios/App
          agvtool new-version -all $PROJECT_BUILD_NUMBER
          cd ../..
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
